<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <script>
        // for문
        // 반복횟수가 정해져 있을 경우 주로 사용
        // for(초기값 ; 조건식 ; 증감식){
        //     실행문
        // }
        for (let i = 0; i < 10; i++) {
            console.log(i);
        }
        // for (let i = 9; 0 < i; i--) {
        //     console.log(i);
        // }

        // let i = 0;
        // while (i < 10) {
        //     console.log(`while 문 실행 : ${i} 번`);
        //     i = i++;
        // }

        let fruit = ["banana", "apple", "mango", "melon", "carrot", "pear", "cherry", "potato"];
        console.log(fruit);

        for (let i = 0; i < fruit.length; i++) {
            console.log(fruit[i]);
        }

        // forEach => 배열의 크기가 정해져 있지 않을 때 씀

        fruit.forEach(function (fruit, index) {
            // 실행문
        });

        //for ... in 문
        //객체에 사용할 수 잇는 반복문
        //for key in 객체명
        // 반복해서 key 값을 가져옴

        const std = {
            name: "홍길동",
            age: 23,
            gender: "female",
            major: "C S",
            phone: "010-9999-9999",
        };

        for (key in std) {
            document.write(`${key} : ${std[key]}<br/>`);
        }

        //문제 3.가격 할인 적용 하기
        // 상품 가격 배열의 각 항목에 10% 할인을 적용해 출력해주세요

        let prices = [10000, 25000, 32000, 50000];

        prices.forEach(function (item, _) {
            document.write(`할인 된  가격 ${item * 0.9}원 <br/>`);
        });

        //문제 4
        //객체의 평균 구하기

        const students = [
            { name: "Mina", score: 88 },
            { name: "Leo", score: 92 },
            { name: "Jinsoo1", score: 76 },
            { name: "Jinsoo2", score: 76 },
            { name: "Jinsoo3", score: 76 },
            { name: "Jinsoo4", score: 76 },
            { name: "Kai", score: 84 },
        ];

        let result = 0;

        students.forEach(function (item, index) {
            result += item.score;
        });
        result = result / students.length;
        document.write(`평균 점수 : ${result}`);

        const scores = [95, 82, 67, 73, 100];

        scores.forEach(function (item, idx) {
            if (item >= 90) {
                console.log(`${item} 은 A 학점입니다.`);
                return;
            }
            if (item >= 80) {
                console.log(`${item} 은 B 학점입니다.`);
                return;
            }
            if (item >= 70) {
                console.log(`${item} 은 C 학점입니다.`);
                return;
            }
            console.log(`${item} 은 F 학점입니다.`);
        });

        for (const score of scores) {
            const grade = score >= 90 ? "A" : score >= 80 ? "B" : score >= 70 ? "C" : "F";
            console.log(`${score} 은 ${grade} 학점입니다.`);
        }
    </script>

    <body></body>
</html>
