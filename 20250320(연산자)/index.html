<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script>
            // basic

            let x = 1 + 2;
            x = x + 2;
            x = x - 2;
            x = x * 2;
            x = x / 2;
            x = x % 2;

            //비교연산자

            let z = 2;
            z = z < 2;

            let a = 1;
            // a++;
            let c = a++; //후위 증감 연산자 a= a +1 : a의  현재값이 사용된 후에 a의 값을 1 증가
            console.log(c, a);
            let b = 10;
            let d = ++b; //전위 증감 연산자 b =b+1  : b의 현재값을 1증가 시킨 후 1증가
            console.log(b, d);

            let f = 10;
            let h = (f += 2); // f+=2
            console.log(f, h);

            x = 10;
            let y = 5;
            let result = ++x - y;
            let result2 = x + --y;
            console.log(`
                x는 ${x} y는 ${y} result는 ${result}
            `);
            console.log(`
                x는 ${x} y는 ${y} result2는 ${result2}
            `);

            // console.log(x, y, result);
        </script>
